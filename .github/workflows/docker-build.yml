name: Docker Image CI

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Generate image name
        id: meta
        run: |
          GHCR_REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$GHCR_REPO_LOWER" >> $GITHUB_OUTPUT
          PLATFORM_SLUG=$(echo "${{ matrix.platform }}" | tr '/' '-')
          echo "platform_slug=$PLATFORM_SLUG" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          outputs: type=image,name=${{ steps.meta.outputs.image }},push-by-digest=true,name-canonical=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ steps.meta.outputs.platform_slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Generate tags
        id: meta
        run: |
          GHCR_REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          GHCR_IMAGE="ghcr.io/$GHCR_REPO_LOWER"

          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            TAGS="$GHCR_IMAGE:latest $GHCR_IMAGE:$VERSION"
          else
            BRANCH_NAME=${GITHUB_REF#refs/heads/}
            TAGS="$GHCR_IMAGE:${BRANCH_NAME}"
          fi

          echo "tags=$TAGS" >> $GITHUB_OUTPUT
          echo "image=$GHCR_IMAGE" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create and push manifest
        working-directory: /tmp/digests
        run: |
          IMAGE="${{ steps.meta.outputs.image }}"
          SOURCES=""
          for digest in *; do
            SOURCES="$SOURCES $IMAGE@sha256:$digest"
          done
          for tag in ${{ steps.meta.outputs.tags }}; do
            docker buildx imagetools create --tag "$tag" $SOURCES
            echo "Pushed manifest: $tag"
          done
